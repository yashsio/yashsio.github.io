<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Yash Sharma</title>

  <style>
    :root {
      --background: #171310;
      --text: #f2e8dc;
      --muted: #aa9888;
      --line: #493a31;
      --accent: #c8794a;
      --accent-dark: #211610;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: min(1000px, calc(100% - 48px));
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 12vw, 8.5rem);
      font-weight: 400;
      letter-spacing: -0.075em;
      line-height: 0.9;
    }

    .intro {
      max-width: 430px;
      margin: 30px auto 42px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    a {
      color: #c8794a;
    }

    a:hover {
      color: #f2e8dc;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a {
     color: #806f62;
     transition: color 0.2s;
    }
    nav a:hover {
     color: #f2e8dc;
    }    

    nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    
    @media (max-width: 480px) {
      main {
        width: min(100% - 32px, 680px);
        padding: 48px 0;
      }

      nav a {
        padding: 11px 15px;
      }
    }
  </style>
</head>
